[project]
name = "lek24-mcp"
version = "0.1.0"
description = "MCP server: read-only search of pharmacy offers on 24lek.ru (stdio + Streamable HTTP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx2>=2.13.1,<3",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pydantic==2.13.5",
]

[project.scripts]
lek24-mcp = "lek24_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lek24_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m 'not live'"
markers = ["live: hits the real 24lek.ru (opt-in: -m live)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]  # Cyrillic text is intentional; if/else often reads better

[tool.ruff.lint.per-file-ignores]
"tests/test_directory.py" = ["E501"]  # inline HTML rows

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
